<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abrindo sala…</title>
    <script>
      const parts = location.pathname.split('/').filter(Boolean);
      const base = parts[0] === 'sala' || parts.length === 0 ? '/' : `/${parts[0]}/`;
      const route = location.pathname + location.search + location.hash;
      sessionStorage.setItem('screen-share-gh-pages-route', route);
      location.replace(base);
    </script>
  </head>
  <body><p>Abrindo sala…</p></body>
</html>
