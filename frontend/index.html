<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0909" />
    <meta name="description" content="Carpe Diem RPG — salas privadas para compartilhar aventuras." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet" />
    <title>Carpe Diem RPG — Salas de aventura</title>
    <script>
      (() => {
        const key = 'screen-share-gh-pages-route';
        const saved = sessionStorage.getItem(key);
        if (saved) {
          sessionStorage.removeItem(key);
          history.replaceState(null, '', saved);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
