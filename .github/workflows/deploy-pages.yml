name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate signaling server configuration
        env:
          VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
        run: |
          if [ -z "$VITE_SIGNALING_URL" ]; then
            echo "::error title=Missing backend URL::Set the VITE_SIGNALING_URL Actions variable to the HTTPS URL of the Render backend."
            exit 1
          fi
      - name: Build site
        run: npm run build:frontend
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
